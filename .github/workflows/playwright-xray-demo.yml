name: Playwright Xray Demo

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Demo outcome
        required: true
        default: success
        type: choice
        options:
          - success
          - failure

jobs:
  playwright-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3000
      TEST_AGENT_USERNAME: agent
      TEST_AGENT_PASSWORD: agent123
      DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DEMO_OUTCOME: ${{ github.event.inputs.outcome }}
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      XRAY_TEST_EXECUTION_KEY: ${{ secrets.XRAY_TEST_EXECUTION_KEY }}
      XRAY_TEST_KEY_UI: ${{ secrets.XRAY_TEST_KEY_UI }}
      XRAY_TEST_KEY_API: ${{ secrets.XRAY_TEST_KEY_API }}
      XRAY_TEST_PLAN_KEY: ${{ secrets.XRAY_TEST_PLAN_KEY }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      DRY_RUN: ${{ secrets.XRAY_DRY_RUN }}
      CI: true
      PORT: 3000
      JIRA_BASE_URL: https://valueit-labs.atlassian.net
      RELEASE_NAME: R1.0
      TEST_ENVIRONMENT: PREPROD
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_WORKFLOW: ${{ github.workflow }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply local defaults for missing secrets
        run: |
          echo "DEMO_RESET_TOKEN=${DEMO_RESET_TOKEN:-demo-reset-token}" >> "$GITHUB_ENV"
          echo "JWT_SECRET=${JWT_SECRET:-ci-jwt-secret}" >> "$GITHUB_ENV"
          # Treat only explicit true/1/yes as dry-run; default false for CI publish
          if [ "${DRY_RUN}" = "true" ] || [ "${DRY_RUN}" = "1" ] || [ "${DRY_RUN}" = "yes" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "XRAY_DRY_RUN_ACTIVE=true" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
            echo "XRAY_DRY_RUN_ACTIVE=false" >> "$GITHUB_ENV"
          fi
          echo "JIRA_BASE_URL=${JIRA_BASE_URL:-https://valueit-labs.atlassian.net}" >> "$GITHUB_ENV"
          echo "XRAY_TEST_PLAN_KEY=${XRAY_TEST_PLAN_KEY:-FDF-31}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_NAME:-R1.0}" >> "$GITHUB_ENV"
          echo "TEST_ENVIRONMENT=${TEST_ENVIRONMENT:-PREPROD}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize SQLite
        run: npm run db:init

      - name: Build backend and frontend
        run: npm run build

      - name: Start backend
        run: |
          npm run start -w backend > /tmp/backend.log 2>&1 &
          echo "Backend PID $!"

      - name: Start frontend
        run: |
          npm run preview -w frontend > /tmp/frontend.log 2>&1 &
          echo "Frontend PID $!"

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then
              echo
              echo "Backend is up"
              exit 0
            fi
            echo "Attempt $i/60 — waiting for backend..."
            sleep 2
          done
          echo "Backend failed to become healthy"
          echo "===== backend.log ====="
          cat /tmp/backend.log || true
          echo "===== frontend.log ====="
          cat /tmp/frontend.log || true
          exit 1

      - name: Reset demo data
        run: |
          curl -sf -X POST http://localhost:3000/api/demo/reset \
            -H "x-demo-reset-token: ${DEMO_RESET_TOKEN}"

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm run test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: test-results/junit-results.xml
          if-no-files-found: ignore

      - name: Publish results to Xray
        if: always()
        run: npm run xray:import

      - name: Fail job if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
